name: Upgrade top 10 SEO pages

on:
  push:
    paths:
      - '.github/workflows/upgrade-top10-seo.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade top tool pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, html

          base = "https://sifatghayoor786.github.io/toolpilot/tools/"

          pages = {
            "invoice-generator.html": {
              "title": "Invoice Generator with Tax & Discount | ToolPilot",
              "desc": "Calculate invoice totals with discount, sales tax or VAT in USD, GBP, CAD, AUD or EUR. Free browser-based invoice calculator with no signup.",
              "intro": "Calculate a professional invoice total from subtotal, discount and sales tax or VAT in seconds.",
              "content": """<h2>Free invoice total calculator</h2>
<p>Use this invoice generator when you already know the line-item subtotal and need a fast, transparent total. Choose USD, GBP, CAD, AUD or EUR, enter any discount, then add the sales tax or VAT percentage that applies to your transaction.</p>
<h3>How the calculation works</h3>
<p>The discount is deducted first. Tax is then calculated on the discounted subtotal.</p>
<p><code>Discount = Subtotal × Discount %</code><br><code>Taxable subtotal = Subtotal − Discount</code><br><code>Tax = Taxable subtotal × Tax %</code><br><code>Invoice total = Taxable subtotal + Tax</code></p>
<h3>Example</h3>
<p>For a $1,000 subtotal with a 10% discount and 8% tax, the discount is $100, the taxable subtotal is $900, tax is $72 and the final invoice total is $972.</p>
<h3>US, UK, Canada, Australia and Europe</h3>
<p>The calculator supports multiple currencies, but it does not choose a tax rate for you. Enter the rate required for your sale, whether that is a US sales-tax rate, VAT, GST/HST or another applicable consumption tax. Tax rules can depend on location, product type and customer status.</p>
<h2>Common questions</h2>
<h3>Does this create a downloadable invoice?</h3><p>This version calculates the financial summary. Use the result as the total for your own invoice document or billing system.</p>
<h3>Is tax applied before or after the discount?</h3><p>This tool applies tax after the discount. If your jurisdiction or contract uses a different treatment, calculate according to the rule that applies to you.</p>
<h3>Is my invoice data uploaded?</h3><p>The calculation runs in your browser and does not require an account.</p>""",
              "related": [("quote-generator.html","Quote / Estimate Generator"),("percentage-change-calculator.html","Percentage Change Calculator"),("gross-profit-calculator.html","Gross Profit Calculator")]
            },
            "contractor-estimate-calculator.html": {
              "title": "Contractor Estimate Calculator | ToolPilot",
              "desc": "Estimate a contractor job price from materials, labor hours, labor rate, overhead and profit markup. Free project estimate calculator for contractors.",
              "intro": "Estimate a contractor job price from materials, labor, overhead and profit markup.",
              "content": """<h2>Contractor job estimate calculator</h2>
<p>This calculator helps contractors, remodelers, installers and small service businesses build a quick project-price estimate from the main cost drivers: materials, labor, overhead and markup.</p>
<h3>How the estimate is calculated</h3>
<p><code>Labor cost = Labor hours × Hourly labor rate</code><br><code>Direct cost = Materials + Labor cost</code><br><code>Overhead = Direct cost × Overhead %</code><br><code>Cost base = Direct cost + Overhead</code><br><code>Estimated price = Cost base × (1 + Markup %)</code></p>
<h3>Example</h3>
<p>With $5,000 of materials, 80 labor hours at $45/hour, 12% overhead and 20% markup, direct cost is $8,600, overhead is $1,032 and the estimated project price is about $11,558.40.</p>
<h3>What should overhead include?</h3>
<p>Depending on the business, overhead can include vehicles, insurance, office costs, non-billable supervision, software, small tools and other operating expenses. Keep your method consistent so estimates are comparable.</p>
<h3>Country and local-cost note</h3>
<p>The math works with USD, GBP, CAD, AUD and EUR, but local labor rates, permits, taxes, insurance requirements and material prices vary widely. Treat the result as a pricing worksheet rather than a substitute for a detailed scope of work.</p>
<h2>Common questions</h2>
<h3>Is markup the same as margin?</h3><p>No. Markup is calculated on cost, while profit margin is profit divided by selling price. A 20% markup does not equal a 20% margin.</p>
<h3>Should contingency be included?</h3><p>For uncertain work, many estimators track contingency separately rather than hiding it inside labor or material cost.</p>""",
              "related": [("quote-generator.html","Quote / Estimate Generator"),("project-cost-estimator.html","Project Cost Estimator"),("markup-calculator.html","Markup Calculator")]
            },
            "loan-payment-calculator.html": {
              "title": "Loan Payment Calculator: Monthly Payment & Interest | ToolPilot",
              "desc": "Calculate monthly loan payments, total interest and total repayment from loan amount, APR and term. Supports USD, GBP, CAD, AUD and EUR.",
              "intro": "Calculate monthly loan payments, total interest and total repayment from amount, APR and term.",
              "content": """<h2>Loan repayment calculator</h2>
<p>Use this tool to estimate the payment on a fixed-rate amortizing loan. Enter the amount borrowed, annual percentage rate (APR) and term in years to see the estimated monthly payment, total interest and total amount repaid.</p>
<h3>Formula used</h3>
<p>The calculator uses the standard fixed-payment amortization formula, where the monthly rate is the annual rate divided by 12 and the number of payments is the term in years multiplied by 12.</p>
<h3>Example</h3>
<p>A $25,000 loan at 7.5% APR over 5 years produces an estimated monthly payment of about $500.95. Across 60 payments, total repayment is about $30,056.92, including roughly $5,056.92 of interest.</p>
<h3>What the result does not include</h3>
<p>Real loans may include origination fees, insurance, taxes, variable rates, balloon payments, promotional periods or lender-specific rounding. APR definitions and disclosure rules also differ by market. Use the lender's official disclosure for a final decision.</p>
<h2>Common questions</h2>
<h3>What happens if the APR is 0%?</h3><p>The calculator divides the principal evenly across the selected number of monthly payments.</p>
<h3>Can I use it for car, personal or business loans?</h3><p>Yes, when the loan uses a conventional fixed-rate amortizing structure. It is not designed for credit cards, interest-only products or irregular payment schedules.</p>
<h3>Does currency change the formula?</h3><p>No. Currency changes the display only; the amortization math is the same.</p>""",
              "related": [("apr-comparison-tool.html","APR Comparison Tool"),("debt-payoff-planner.html","Debt Payoff Planner"),("mortgage-overpayment-calculator.html","Mortgage Overpayment Calculator")]
            },
            "mortgage-overpayment-calculator.html": {
              "title": "Mortgage Overpayment Calculator | ToolPilot",
              "desc": "Estimate how extra monthly mortgage payments can reduce payoff time and interest. Compare the standard schedule with regular overpayments.",
              "intro": "Estimate how an extra monthly mortgage payment can reduce interest and shorten your payoff time.",
              "content": """<h2>Mortgage extra-payment calculator</h2>
<p>Regular overpayments reduce principal faster, which can reduce the interest charged in later months. This calculator compares the standard remaining mortgage schedule with a schedule that includes a fixed extra payment every month.</p>
<h3>How it works</h3>
<p>The standard monthly payment is calculated from the current balance, interest rate and remaining term. The tool then simulates the balance month by month, first with the normal payment and then with your chosen extra payment.</p>
<h3>Example</h3>
<p>On a $300,000 balance at 6% with 25 years remaining, the standard payment is about $1,932.90 per month. Adding $250 per month can reduce the modeled payoff period by about 67 months and reduce modeled interest by roughly $71,272, assuming the rate stays fixed and there are no prepayment charges.</p>
<h3>Before making an overpayment</h3>
<p>Mortgage contracts vary. Some lenders allow unrestricted extra principal payments, while others impose annual limits, early-repayment charges or special instructions for applying extra money to principal. Check the terms of your mortgage before relying on an estimate.</p>
<h2>Common questions</h2>
<h3>Does the calculator assume the interest rate stays fixed?</h3><p>Yes. If your mortgage rate changes, actual savings will differ.</p>
<h3>Does an overpayment always shorten the term?</h3><p>In this model, extra money is applied to principal while the scheduled payment continues, which shortens the payoff period.</p>""",
              "related": [("loan-payment-calculator.html","Loan Payment Calculator"),("debt-payoff-planner.html","Debt Payoff Planner"),("rent-vs-buy-calculator.html","Rent vs Buy Calculator")]
            },
            "excel-formula-builder.html": {
              "title": "Excel Formula Builder: IF, SUMIF & XLOOKUP | ToolPilot",
              "desc": "Build common Excel formulas including IF, SUMIF, XLOOKUP, CONCAT and percentage change. Enter cell references and copy the generated formula.",
              "intro": "Build common Excel formulas such as IF, SUMIF, XLOOKUP, CONCAT and percentage change.",
              "content": """<h2>Excel formula builder</h2>
<p>This browser-based builder helps you assemble common spreadsheet formulas without repeatedly checking syntax. Choose a formula pattern, enter the relevant cells or ranges, generate the expression and copy it into Excel or a compatible spreadsheet application.</p>
<h3>Supported formula patterns</h3>
<p><strong>IF</strong> for conditional logic, <strong>SUMIF</strong> for conditional totals, <strong>XLOOKUP</strong> for matching and returning values, <strong>CONCAT</strong> for joining text and a percentage-change pattern for comparing two values.</p>
<h3>XLOOKUP example</h3>
<p>If cell A2 contains a product code, B2:B100 is the lookup range and C2:C100 contains the price, the generated structure can be used to return the matching price from column C.</p>
<h3>Excel locale note</h3>
<p>Some regional Excel installations use semicolons instead of commas as function argument separators. If Excel rejects a generated formula, check your regional list-separator setting and replace commas with semicolons if required.</p>
<h2>Common questions</h2>
<h3>Does this use an AI API?</h3><p>No. The supported formula patterns are generated directly in your browser.</p>
<h3>Will the formulas work in Google Sheets?</h3><p>Many common formulas are compatible, but function behavior and availability can differ between Excel versions and spreadsheet products.</p>
<h3>Can it build every Excel formula?</h3><p>No. This first version focuses on several frequently used patterns. Complex nested formulas may still require manual editing.</p>""",
              "related": [("percentage-change-calculator.html","Percentage Change Calculator"),("csv-cleaner.html","CSV Cleaner"),("csv-to-json-converter.html","CSV to JSON Converter")]
            },
            "roofing-calculator.html": {
              "title": "Roofing Calculator: Squares, Bundles & Waste | ToolPilot",
              "desc": "Estimate roof area, roofing squares, waste allowance and shingle bundles from building dimensions and pitch. Free US roofing material calculator.",
              "intro": "Estimate roof area, roofing squares, waste allowance and approximate shingle bundles.",
              "content": """<h2>Roofing material calculator</h2>
<p>This calculator is designed around common US roofing measurements. Enter building length and width in feet, use a pitch multiplier to approximate the sloped roof surface, add a waste percentage and enter the number of bundles required per roofing square.</p>
<h3>Roofing square formula</h3>
<p>One roofing square equals 100 square feet of roof area.</p>
<p><code>Base area = Length × Width</code><br><code>Sloped area = Base area × Pitch multiplier</code><br><code>Area with waste = Sloped area × (1 + Waste %)</code><br><code>Roofing squares = Area with waste ÷ 100</code></p>
<h3>Example</h3>
<p>A 50 ft × 30 ft footprint with a 1.12 pitch multiplier gives about 1,680 sq ft of roof surface. With 10% waste, that becomes 1,848 sq ft or 18.48 roofing squares. At 3 bundles per square, the mathematical requirement is 55.44 bundles, so purchasing would normally require rounding up to whole bundles.</p>
<h3>Why actual material can differ</h3>
<p>Valleys, hips, ridges, dormers, starter strips, cap shingles, flashing and unusual roof geometry can increase material needs. The pitch multiplier must also match the roof slope. Use measured roof planes for a more precise takeoff.</p>
<h2>Common questions</h2>
<h3>What waste percentage should I use?</h3><p>Waste depends on roof complexity and material. Use a percentage appropriate to the specific job rather than treating the default as a recommendation.</p>
<h3>Does this work in metric units?</h3><p>This version is intentionally US-focused and uses feet, square feet and roofing squares.</p>""",
              "related": [("contractor-estimate-calculator.html","Contractor Estimate Calculator"),("painting-cost-estimator.html","Painting Cost Estimator"),("flooring-calculator.html","Flooring Calculator")]
            },
            "roi-calculator.html": {
              "title": "ROI Calculator: Return on Investment | ToolPilot",
              "desc": "Calculate investment profit and ROI percentage from initial cost and final value or revenue. Free return-on-investment calculator in multiple currencies.",
              "intro": "Calculate net return and return on investment (ROI) percentage from cost and final value.",
              "content": """<h2>Return on investment calculator</h2>
<p>ROI is a simple way to compare the return generated by an investment with the amount invested. Enter the original cost and the final value or revenue received to calculate both net profit and ROI percentage.</p>
<h3>ROI formula</h3>
<p><code>Net return = Final value − Investment</code><br><code>ROI % = Net return ÷ Investment × 100</code></p>
<h3>Example</h3>
<p>If an investment costs $10,000 and produces a final value of $13,500, the net return is $3,500 and ROI is 35%.</p>
<h3>ROI does not measure time</h3>
<p>A 20% ROI earned in six months is different from the same ROI earned over five years. This simple calculator does not annualize returns, model cash-flow timing or adjust for inflation, risk, tax or financing costs.</p>
<h2>Common questions</h2>
<h3>Can ROI be negative?</h3><p>Yes. If the final value is below the original investment, the net return and ROI are negative.</p>
<h3>Can I use revenue instead of final value?</h3><p>Only if revenue is the appropriate return measure for your analysis. For a business project, consider whether operating costs should be deducted before interpreting ROI.</p>""",
              "related": [("gross-profit-calculator.html","Gross Profit Calculator"),("break-even-calculator.html","Break-Even Calculator"),("project-cost-estimator.html","Project Cost Estimator")]
            },
            "manufacturing-cost-calculator.html": {
              "title": "Manufacturing Cost Per Unit Calculator | ToolPilot",
              "desc": "Calculate manufacturing cost per good unit from materials, direct labor, factory overhead and scrap or waste cost. Free production costing calculator.",
              "intro": "Calculate total manufacturing cost and cost per good unit from materials, labor, overhead and waste.",
              "content": """<h2>Manufacturing cost per unit calculator</h2>
<p>This tool provides a compact factory-cost view by combining direct material, direct labor, manufacturing overhead and scrap or waste cost, then dividing the total by good units produced.</p>
<h3>Formula</h3>
<p><code>Total manufacturing cost = Materials + Direct labor + Manufacturing overhead + Scrap/Waste cost</code><br><code>Cost per good unit = Total manufacturing cost ÷ Good units produced</code></p>
<h3>Example</h3>
<p>With $12,000 materials, $5,000 direct labor, $3,500 manufacturing overhead and $800 scrap cost, total modeled manufacturing cost is $21,300. At 100,000 good units, the modeled cost is $0.213 per good unit.</p>
<h3>What belongs in manufacturing overhead?</h3>
<p>Depending on your costing method, factory overhead may include indirect production labor, utilities, depreciation, maintenance, supervision and other production-support expenses. Selling, distribution and corporate administrative costs are often tracked separately.</p>
<h3>Good output matters</h3>
<p>Dividing by good units rather than gross production makes quality loss visible in unit cost. Use consistent definitions for scrap, rework and accepted output when comparing periods or lines.</p>
<h2>Common questions</h2>
<h3>Is this the same as full product profitability?</h3><p>No. It estimates manufacturing cost. Freight, warehousing, selling expenses, commissions, financing and taxes may need separate treatment.</p>
<h3>Can I use kilograms or batches instead of pieces?</h3><p>Yes, if the output quantity and cost basis are consistent. The result is cost per output unit entered.</p>""",
              "related": [("waste-percentage-calculator.html","Scrap / Waste Percentage Calculator"),("oee-calculator.html","OEE Calculator"),("gross-profit-calculator.html","Gross Profit Calculator")]
            },
            "inventory-reorder-planner.html": {
              "title": "Inventory Reorder Point Calculator | ToolPilot",
              "desc": "Calculate reorder point and safety stock from average daily demand, supplier lead time and safety-stock days. Free inventory replenishment planner.",
              "intro": "Calculate reorder point, safety stock and approximate replenishment timing from demand and lead time.",
              "content": """<h2>Inventory reorder point calculator</h2>
<p>A reorder point is the stock level at which replenishment should be triggered so expected demand can be covered while the next order is in transit. This simplified planner uses average daily demand, lead time and a safety-stock allowance expressed in days.</p>
<h3>Formula</h3>
<p><code>Lead-time demand = Average daily demand × Lead time</code><br><code>Safety stock = Average daily demand × Safety-stock days</code><br><code>Reorder point = Lead-time demand + Safety stock</code></p>
<h3>Example</h3>
<p>At 120 units of average daily demand, a 14-day lead time requires 1,680 units for expected lead-time demand. Five safety-stock days add 600 units, producing a reorder point of 2,280 units.</p>
<h3>When this simple model works best</h3>
<p>The method is useful when demand and lead time are reasonably stable. Highly seasonal products, intermittent demand, uncertain supplier performance or minimum-order constraints may require a more advanced safety-stock method.</p>
<h2>Common questions</h2>
<h3>Is safety stock the same as reorder point?</h3><p>No. Safety stock is the buffer. The reorder point combines expected lead-time demand with that buffer.</p>
<h3>Should stock on open purchase orders be included?</h3><p>For operational decisions, many businesses evaluate inventory position rather than only physical on-hand stock. Define your policy consistently before using the result.</p>""",
              "related": [("manufacturing-cost-calculator.html","Manufacturing Cost Calculator"),("waste-percentage-calculator.html","Scrap / Waste Percentage Calculator"),("project-cost-estimator.html","Project Cost Estimator")]
            },
            "oee-calculator.html": {
              "title": "OEE Calculator: Availability, Performance & Quality | ToolPilot",
              "desc": "Calculate Overall Equipment Effectiveness (OEE) from planned time, run time, ideal cycle time, total count and good count. Free manufacturing OEE tool.",
              "intro": "Calculate Availability, Performance, Quality and Overall Equipment Effectiveness (OEE).",
              "content": """<h2>Overall Equipment Effectiveness calculator</h2>
<p>OEE combines three manufacturing metrics into one measure: Availability, Performance and Quality. It is most useful when the definitions and data-collection rules stay consistent across machines, lines and reporting periods.</p>
<h3>OEE formulas</h3>
<p><code>Availability = Run time ÷ Planned production time</code><br><code>Performance = (Ideal cycle time × Total count) ÷ Run time</code><br><code>Quality = Good count ÷ Total count</code><br><code>OEE = Availability × Performance × Quality</code></p>
<h3>Example</h3>
<p>Using 480 planned minutes, 420 run minutes, a 2.5-second ideal cycle time, 9,000 total units and 8,700 good units gives Availability of 87.5%, Performance of about 89.29%, Quality of about 96.67% and modeled OEE of about 75.52%.</p>
<h3>Interpret the losses separately</h3>
<p>Two machines can have the same OEE for very different reasons. Availability points to downtime, Performance to speed loss and minor stops, and Quality to rejected output. Diagnose the three components before acting on the combined number.</p>
<h2>Common questions</h2>
<h3>Can OEE exceed 100%?</h3><p>With valid inputs and a true ideal cycle time, the components should not exceed 100%. A result above 100% usually indicates a data-definition or ideal-cycle-time issue.</p>
<h3>Should planned breaks be included?</h3><p>That depends on your OEE definition. Choose a consistent planned-production-time policy and use it across comparisons.</p>""",
              "related": [("manufacturing-cost-calculator.html","Manufacturing Cost Calculator"),("waste-percentage-calculator.html","Scrap / Waste Percentage Calculator"),("inventory-reorder-planner.html","Inventory Reorder Planner")]
            }
          }

          for filename, cfg in pages.items():
              p = Path("tools") / filename
              s = p.read_text(encoding="utf-8")
              url = base + filename

              s = re.sub(r'<title>.*?</title>', f'<title>{html.escape(cfg["title"])}</title>', s, count=1, flags=re.S)
              if re.search(r'<meta name="description" content="[^"]*">', s):
                  s = re.sub(r'<meta name="description" content="[^"]*">', f'<meta name="description" content="{html.escape(cfg["desc"], quote=True)}">', s, count=1)
              else:
                  s = s.replace('</title>', f'</title><meta name="description" content="{html.escape(cfg["desc"], quote=True)}">', 1)

              s = re.sub(r'<p class="tool-intro">.*?</p>', f'<p class="tool-intro">{cfg["intro"]}</p>', s, count=1, flags=re.S)

              # Replace the first explanatory content box with richer, unique content.
              s = re.sub(
                  r'<div class="contentbox prose">[sS]*?</div>',
                  '<div class="contentbox prose">' + cfg["content"] + '</div>',
                  s, count=1
              )

              related = ''.join(f'<a href="{href}">{label}</a>' for href,label in cfg["related"])
              s = re.sub(
                  r'<section class="section"><h2>Related tools</h2><div class="related">[sS]*?</div></section>',
                  '<section class="section"><h2>Related tools</h2><div class="related">' + related + '</div></section>',
                  s, count=1
              )

              # Refresh structured data to match visible page copy and add breadcrumbs.
              graph = {
                  "@context":"https://schema.org",
                  "@graph":[
                      {
                          "@type":"WebApplication",
                          "name":re.sub(r' \| ToolPilot$', '', cfg["title"]),
                          "url":url,
                          "description":cfg["desc"],
                          "applicationCategory":"UtilitiesApplication",
                          "operatingSystem":"Any",
                          "offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}
                      },
                      {
                          "@type":"BreadcrumbList",
                          "itemListElement":[
                              {"@type":"ListItem","position":1,"name":"ToolPilot","item":"https://sifatghayoor786.github.io/toolpilot/"},
                              {"@type":"ListItem","position":2,"name":re.sub(r' \| ToolPilot$', '', cfg["title"]),"item":url}
                          ]
                      }
                  ]
              }
              block = '<script type="application/ld+json">' + json.dumps(graph, separators=(',',':')) + '</script>'
              if re.search(r'<script type="application/ld\+json">[sS]*?</script>', s):
                  s = re.sub(r'<script type="application/ld\+json">[sS]*?</script>', block, s, count=1)
              else:
                  s = s.replace('</head>', block + '</head>', 1)

              # Social preview metadata.
              og = (
                  f'<meta property="og:type" content="website">'
                  f'<meta property="og:title" content="{html.escape(cfg["title"], quote=True)}">'
                  f'<meta property="og:description" content="{html.escape(cfg["desc"], quote=True)}">'
                  f'<meta property="og:url" content="{url}">'
                  f'<meta name="twitter:card" content="summary">'
              )
              if 'property="og:title"' not in s:
                  s = s.replace('</head>', og + '</head>', 1)

              p.write_text(s, encoding="utf-8")

          # Add lastmod for upgraded pages in sitemap.
          sp = Path("sitemap.xml")
          sx = sp.read_text(encoding="utf-8")
          for filename in pages:
              loc = base + filename
              pattern = rf'<url><loc>{re.escape(loc)}</loc>(?:<lastmod>.*?</lastmod>)?</url>'
              replacement = f'<url><loc>{loc}</loc><lastmod>2026-09-22</lastmod></url>'
              sx = re.sub(pattern, replacement, sx)
          sp.write_text(sx, encoding="utf-8")
          PY

      - name: Validate upgraded HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          files = [
            "invoice-generator.html","contractor-estimate-calculator.html","loan-payment-calculator.html",
            "mortgage-overpayment-calculator.html","excel-formula-builder.html","roofing-calculator.html",
            "roi-calculator.html","manufacturing-cost-calculator.html","inventory-reorder-planner.html","oee-calculator.html"
          ]
          for f in files:
              s=(Path("tools")/f).read_text(encoding="utf-8")
              assert '<link rel="canonical"' in s, f
              assert '<meta name="description"' in s, f
              assert '<h2>Common questions</h2>' in s, f
              m=re.search(r'<script type="application/ld\+json">([\s\S]*?)</script>',s)
              assert m, f
              json.loads(m.group(1))
          print("Validated", len(files), "SEO pages")
          PY

      - name: Commit SEO upgrades
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/*.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Upgrade top 10 tool pages for SEO and usefulness"
            git push
          fi
